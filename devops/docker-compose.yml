version: '3.8'

services:
  agent-api:
    build:
      context: ..
      dockerfile: devops/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis-cache:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-leaduser}:${POSTGRES_PASSWORD:-leadpass}@postgres-db:5432/leaddb
    depends_on:
      - redis-cache
      - postgres-db
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  postgres-db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-leaduser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-leadpass}
      - POSTGRES_DB=leaddb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
